{% extends 'base.html' %}

{% block title %}{{ pagina.titulo }} - ICE Asunción{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <h1 class="mb-4">{{ pagina.titulo }}</h1>

            {% if pagina.descripcion %}
            <p class="lead">{{ pagina.descripcion }}</p>
            {% endif %}

            {% if pagina.imagen %}
            <img src="{{ pagina.imagen.url }}" class="img-fluid rounded mb-4" alt="{{ pagina.titulo }}">
            {% endif %}

            <div class="content">
                {{ pagina.contenido|safe }}
            </div>

            <div class="mt-5">
                <a href="{% url 'home' %}" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
