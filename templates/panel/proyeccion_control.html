<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectar - {{ presentacion.titulo }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        .canvas-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #pdfCanvas {
            max-width: 100%;
            max-height: 100vh;
            background: white;
        }

        /* Barra superior con controles - aparece al mover el mouse */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            padding: 0.75rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .top-bar.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .top-titulo {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .top-titulo .codigo {
            font-family: monospace;
            background: rgba(255,255,255,0.15);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            margin-left: 0.5rem;
            font-size: 0.85rem;
        }

        .top-acciones {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icono {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            text-decoration: none;
        }

        .btn-icono:hover { background: rgba(255,255,255,0.3); }
        .btn-icono.danger:hover { background: #ef5350; }
        .btn-icono.finalizada { background: #2e7d32; }
        .btn-icono.finalizada:hover { background: #1b5e20; }

        /* Controles inferiores */
        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            z-index: 100;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .bottom-bar.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-nav {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.7rem 1.25rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            min-width: 130px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            backdrop-filter: blur(10px);
        }

        .btn-nav:hover { background: rgba(255,255,255,0.3); }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        .slide-info {
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 80px;
            text-align: center;
            background: rgba(255,255,255,0.15);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        /* Modal QR */
        .qr-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            flex-direction: column;
            gap: 1.5rem;
        }

        .qr-modal.activo { display: flex; }

        .qr-modal img {
            max-width: 80vw;
            max-height: 70vh;
            background: white;
            padding: 2rem;
            border-radius: 16px;
        }

        .qr-modal .url-grande {
            font-family: monospace;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            background: rgba(255,255,255,0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .top-titulo { font-size: 0.85rem; }
            .top-titulo .codigo { display: none; }
            .btn-nav { min-width: 90px; padding: 0.6rem 1rem; font-size: 0.85rem; }
            .qr-modal .url-grande { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <canvas id="pdfCanvas"></canvas>
    </div>

    <div class="top-bar" id="topBar">
        <div class="top-titulo">
            {{ presentacion.titulo }}
            <span class="codigo">{{ presentacion.codigo }}</span>
        </div>
        <div class="top-acciones">
            <button class="btn-icono" onclick="document.getElementById('qrModal').classList.add('activo')" title="Mostrar QR">
                <i class="bi bi-qr-code"></i>
            </button>
            <button class="btn-icono" onclick="toggleFullscreen()" id="btnFullscreen" title="Pantalla completa">
                <i class="bi bi-fullscreen"></i>
            </button>
            <button class="btn-icono" onclick="toggleFinalizar()" id="btnFinalizar" title="Finalizar presentacion">
                <i class="bi bi-flag-fill"></i>
            </button>
            <a href="{% url 'panel:proyeccion_lista' %}" class="btn-icono danger" title="Cerrar">
                <i class="bi bi-x-lg"></i>
            </a>
        </div>
    </div>

    <div class="bottom-bar" id="bottomBar">
        <button class="btn-nav" id="btnPrev" onclick="cambiar(-1)">
            <i class="bi bi-chevron-left"></i> Anterior
        </button>
        <div class="slide-info">
            <span id="slideActual">{{ estado.slide_actual }}</span> / {{ presentacion.total_slides }}
        </div>
        <button class="btn-nav" id="btnNext" onclick="cambiar(1)">
            Siguiente <i class="bi bi-chevron-right"></i>
        </button>
    </div>

    <div class="qr-modal" id="qrModal" onclick="this.classList.remove('activo')">
        <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR">
        <div class="url-grande">{{ url_publica }}</div>
        <div style="color:#94a3b8; font-size:0.9rem;">Toca para cerrar</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs" type="module"></script>
    <script type="module">
        import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';

        const pdfUrl = '{% url "proyeccion_pdf" presentacion.codigo %}';
        const totalSlides = {{ presentacion.total_slides }};
        const csrfToken = '{{ csrf_token }}';
        const avanzarUrl = '{% url "panel:proyeccion_avanzar" presentacion.codigo %}';
        const finalizarUrl = '{% url "panel:proyeccion_finalizar" presentacion.codigo %}';

        let pdfDoc = null;
        let slideActual = {{ estado.slide_actual }};
        let renderizando = false;
        let finalizada = {{ estado.finalizada|yesno:"true,false" }};

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        pdfjsLib.getDocument(pdfUrl).promise.then(function(doc) {
            pdfDoc = doc;
            renderSlide(slideActual);
        });

        function renderSlide(num) {
            if (renderizando) return;
            renderizando = true;
            pdfDoc.getPage(num).then(function(page) {
                const wrap = canvas.parentElement;
                const maxW = wrap.clientWidth;
                const maxH = wrap.clientHeight;
                const viewport0 = page.getViewport({ scale: 1 });
                const scale = Math.min(maxW / viewport0.width, maxH / viewport0.height) * 2;
                const viewport = page.getViewport({ scale: scale });

                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.width = (viewport.width / 2) + 'px';
                canvas.style.height = (viewport.height / 2) + 'px';

                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
                    renderizando = false;
                });
            });
            document.getElementById('slideActual').textContent = num;
            document.getElementById('btnPrev').disabled = num <= 1;
            document.getElementById('btnNext').disabled = num >= totalSlides;
        }

        window.cambiar = function(delta) {
            const nuevo = Math.max(1, Math.min(totalSlides, slideActual + delta));
            if (nuevo === slideActual) return;
            slideActual = nuevo;
            renderSlide(slideActual);

            fetch(avanzarUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ slide: slideActual })
            });
        };

        function actualizarBtnFinalizar() {
            const btn = document.getElementById('btnFinalizar');
            btn.classList.toggle('finalizada', finalizada);
            btn.title = finalizada ? 'Presentacion finalizada (click para reanudar)' : 'Finalizar presentacion';
        }

        window.toggleFinalizar = function() {
            const nuevoValor = !finalizada;
            if (nuevoValor && !confirm('¿Finalizar la presentacion? A los asistentes les aparecera la pantalla de descarga del PDF.')) {
                return;
            }
            fetch(finalizarUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ finalizada: nuevoValor })
            }).then(r => r.json()).then(function(data) {
                if (data.ok) {
                    finalizada = data.finalizada;
                    actualizarBtnFinalizar();
                }
            });
        };

        actualizarBtnFinalizar();

        window.toggleFullscreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function(){});
            } else {
                document.exitFullscreen();
            }
        };

        document.addEventListener('fullscreenchange', function() {
            const icon = document.querySelector('#btnFullscreen i');
            if (document.fullscreenElement) {
                icon.className = 'bi bi-fullscreen-exit';
            } else {
                icon.className = 'bi bi-fullscreen';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                cambiar(1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                cambiar(-1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'Escape') {
                document.getElementById('qrModal').classList.remove('activo');
            }
        });

        // Mostrar/ocultar barras al mover el mouse
        let timeoutHide = null;
        function mostrarChrome() {
            document.getElementById('topBar').classList.add('visible');
            document.getElementById('bottomBar').classList.add('visible');
            if (timeoutHide) clearTimeout(timeoutHide);
            timeoutHide = setTimeout(function() {
                document.getElementById('topBar').classList.remove('visible');
                document.getElementById('bottomBar').classList.remove('visible');
            }, 3500);
        }
        document.body.addEventListener('mousemove', mostrarChrome);
        document.body.addEventListener('touchstart', mostrarChrome);
        mostrarChrome();

        window.addEventListener('resize', function() {
            if (pdfDoc) renderSlide(slideActual);
        });

        // Auto-fullscreen al abrir (requiere interaccion del usuario - mostramos boton bien grande la primera vez)
        // No activamos auto, pero el boton esta arriba y el shortcut es F
    </script>
</body>
</html>
