<!-- Chat Widget ICE Asunción -->
<div id="ice-chat-widget" class="ice-chat-hidden">
    <!-- Botón flotante para abrir el chat -->
    <button id="ice-chat-fab" class="ice-chat-fab" title="Asistente ICE">
        <i class="bi bi-chat-dots-fill"></i>
    </button>

    <!-- Contenedor del chat -->
    <div id="ice-chat-container" class="ice-chat-container">
        <!-- Header del chat -->
        <div class="ice-chat-header">
            <div class="ice-chat-header-info">
                <div class="ice-chat-avatar">
                    <i class="bi bi-robot"></i>
                </div>
                <div class="ice-chat-header-text">
                    <h6>Asistente ICE</h6>
                    <span class="ice-chat-status">En línea</span>
                </div>
            </div>
            <button id="ice-chat-close" class="ice-chat-close" title="Cerrar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <!-- Vista de verificación -->
        <div id="ice-chat-verify" class="ice-chat-body ice-chat-verify">
            <div class="ice-chat-verify-content">
                <div class="ice-chat-verify-icon">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h5>Verificación requerida</h5>
                <p class="text-muted">Para usar el chat, necesitamos verificar tu número de teléfono.</p>

                <!-- Paso 1: Ingresar teléfono -->
                <div id="ice-verify-step1">
                    <div class="mb-3">
                        <label class="form-label">Número de celular</label>
                        <input type="tel" id="ice-phone-input" class="form-control" placeholder="+54 9 381 123 4567">
                    </div>
                    <button id="ice-send-code-btn" class="btn btn-primary w-100">
                        <i class="bi bi-send"></i> Enviar código
                    </button>
                </div>

                <!-- Paso 2: Ingresar código -->
                <div id="ice-verify-step2" class="d-none">
                    <div class="mb-3">
                        <label class="form-label">Código de verificación</label>
                        <input type="text" id="ice-code-input" class="form-control text-center" placeholder="123456" maxlength="6">
                        <small class="text-muted">Ingresa el código de 6 dígitos enviado a tu celular</small>
                    </div>
                    <button id="ice-verify-code-btn" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Verificar
                    </button>
                    <button id="ice-resend-code-btn" class="btn btn-link w-100 mt-2">
                        Reenviar código
                    </button>
                </div>

                <!-- Mensajes de error/éxito -->
                <div id="ice-verify-message" class="mt-3 d-none"></div>
            </div>
        </div>

        <!-- Vista del chat -->
        <div id="ice-chat-main" class="d-none">
            <!-- Área de mensajes -->
            <div id="ice-chat-messages" class="ice-chat-messages">
                <div class="ice-chat-welcome">
                    <div class="ice-chat-welcome-icon">
                        <i class="bi bi-church"></i>
                    </div>
                    <p>¡Hola! Soy el asistente virtual de ICE Asunción. ¿En qué puedo ayudarte?</p>
                </div>
            </div>

            <!-- Área de entrada -->
            <div class="ice-chat-input-area">
                <div class="ice-chat-input-container">
                    <textarea id="ice-chat-input" placeholder="Escribe tu mensaje..." rows="1"></textarea>
                    <div class="ice-chat-input-actions">
                        <button id="ice-audio-btn" class="ice-chat-action-btn" title="Enviar audio">
                            <i class="bi bi-mic"></i>
                        </button>
                        <button id="ice-send-btn" class="ice-chat-action-btn ice-chat-send-btn" title="Enviar">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </div>
                <!-- Indicador de grabación -->
                <div id="ice-recording-indicator" class="ice-recording-indicator d-none">
                    <div class="ice-recording-pulse"></div>
                    <span>Grabando...</span>
                    <button id="ice-stop-recording" class="btn btn-sm btn-danger ms-2">
                        <i class="bi bi-stop-fill"></i> Detener
                    </button>
                </div>
            </div>
        </div>

        <!-- Indicador de carga -->
        <div id="ice-chat-loading" class="ice-chat-loading d-none">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <span>Procesando...</span>
        </div>
    </div>
</div>
