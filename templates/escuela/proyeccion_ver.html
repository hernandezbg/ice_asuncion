<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ presentacion.titulo }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        .header {
            padding: 0.6rem 1rem;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            transition: opacity 0.3s ease;
            gap: 0.5rem;
        }
        .header.oculto { opacity: 0; pointer-events: none; }

        .titulo-pres {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-en-vivo {
            background: #ef5350;
            padding: 0.2rem 0.55rem;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        .badge-en-vivo::before {
            content: '';
            width: 6px; height: 6px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .acciones-header { display: flex; gap: 0.4rem; }

        .btn-icono {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-icono:hover { background: rgba(255,255,255,0.3); }

        .canvas-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #pdfCanvas {
            max-width: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            background: white;
        }

        .footer {
            padding: 0.5rem 1rem;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            text-align: center;
            font-size: 0.75rem;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .footer.oculto { opacity: 0; pointer-events: none; }

        /* Modal final */
        .modal-final {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1.5rem;
        }
        .modal-final.activo { display: flex; }

        .modal-card {
            background: white;
            color: #1e293b;
            border-radius: 16px;
            padding: 2rem 1.5rem;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-card .icono {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .modal-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .modal-card p {
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .modal-acciones {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .btn-modal {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-modal.primary {
            background: #2e7d32;
            color: white;
        }
        .btn-modal.primary:hover { background: #1b5e20; }

        .btn-modal.secondary {
            background: #1565c0;
            color: white;
        }
        .btn-modal.secondary:hover { background: #0d47a1; }

        .btn-modal.outline {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #64748b;
        }
        .btn-modal.outline:hover { background: #f1f5f9; }

        /* Pantalla de bienvenida */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .welcome-screen.oculto { display: none; }

        .welcome-screen .titulo-grande {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .welcome-screen .subtitulo {
            font-size: 0.95rem;
            opacity: 0.85;
            margin-bottom: 2.5rem;
        }

        .btn-entrar {
            background: white;
            color: #0d47a1;
            border: none;
            border-radius: 14px;
            padding: 1.1rem 2.5rem;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .btn-entrar:hover, .btn-entrar:active { transform: scale(1.04); }

        .welcome-icono {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Pantalla de bienvenida -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icono"><i class="bi bi-projector"></i></div>
        <div class="titulo-grande">{{ presentacion.titulo }}</div>
        <div class="subtitulo">Sigue la presentacion en tu celular</div>
        <button class="btn-entrar" onclick="entrar()">
            <i class="bi bi-play-fill"></i>Entrar a la presentacion
        </button>
    </div>

    <div class="header" id="header">
        <div class="titulo-pres">{{ presentacion.titulo }}</div>
        <span class="badge-en-vivo">En vivo</span>
        <div class="acciones-header">
            <button class="btn-icono" onclick="toggleFullscreen()" id="btnFs" title="Pantalla completa">
                <i class="bi bi-fullscreen"></i>
            </button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="pdfCanvas"></canvas>
    </div>

    <div class="footer" id="footer">
        Slide <span id="slideActual">{{ estado.slide_actual }}</span> / {{ presentacion.total_slides }} ·
        ICE Asuncion
    </div>

    <!-- Modal final -->
    <div class="modal-final" id="modalFinal">
        <div class="modal-card">
            <div class="icono"><i class="bi bi-check-lg"></i></div>
            <h3>Presentacion finalizada</h3>
            <p>Gracias por seguir la predica</p>
            <div class="modal-acciones">
                <a href="{% url 'proyeccion_pdf' presentacion.codigo %}" download="{{ presentacion.titulo }}.pdf" class="btn-modal primary">
                    <i class="bi bi-download"></i>Descargar PDF
                </a>
                <a href="/" class="btn-modal secondary">
                    <i class="bi bi-house-fill"></i>Ir a la pagina principal
                </a>
                <button onclick="cerrarModal()" class="btn-modal outline">
                    <i class="bi bi-arrow-left"></i>Volver a la presentacion
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs" type="module"></script>
    <script type="module">
        import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';

        const pdfUrl = '{% url "proyeccion_pdf" presentacion.codigo %}';
        const streamUrl = '{% url "proyeccion_stream" presentacion.codigo %}';
        const estadoUrl = '{% url "proyeccion_estado" presentacion.codigo %}';
        const totalSlides = {{ presentacion.total_slides }};

        let pdfDoc = null;
        let slideActual = {{ estado.slide_actual }};
        let renderizando = false;
        let pendiente = null;
        let modalMostrado = false;

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        pdfjsLib.getDocument(pdfUrl).promise.then(function(doc) {
            pdfDoc = doc;
            renderSlide(slideActual);
        });

        function renderSlide(num) {
            if (!pdfDoc) return;
            if (renderizando) {
                pendiente = num;
                return;
            }
            renderizando = true;
            pdfDoc.getPage(num).then(function(page) {
                const wrap = canvas.parentElement;
                const maxW = wrap.clientWidth;
                const maxH = wrap.clientHeight;
                const viewport0 = page.getViewport({ scale: 1 });
                const scale = Math.min(maxW / viewport0.width, maxH / viewport0.height) * 2;
                const viewport = page.getViewport({ scale: scale });

                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.width = (viewport.width / 2) + 'px';
                canvas.style.height = (viewport.height / 2) + 'px';

                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
                    renderizando = false;
                    if (pendiente !== null && pendiente !== num) {
                        const next = pendiente;
                        pendiente = null;
                        renderSlide(next);
                    } else {
                        pendiente = null;
                    }
                });
            });
            document.getElementById('slideActual').textContent = num;
        }

        function actualizarSlide(nuevo) {
            if (nuevo === slideActual) return;
            const llegoFinal = nuevo === totalSlides && slideActual < totalSlides;
            slideActual = nuevo;
            renderSlide(slideActual);

            // Si llego al ultimo slide, mostrar modal despues de 3s
            if (llegoFinal && !modalMostrado) {
                setTimeout(function() {
                    if (slideActual === totalSlides) {
                        document.getElementById('modalFinal').classList.add('activo');
                        modalMostrado = true;
                    }
                }, 3000);
            }
        }

        window.cerrarModal = function() {
            document.getElementById('modalFinal').classList.remove('activo');
        };

        // Pantalla completa
        window.toggleFullscreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function(){});
            } else {
                document.exitFullscreen();
            }
        };

        // Entrar a la presentacion: oculta welcome y activa fullscreen
        window.entrar = function() {
            document.getElementById('welcomeScreen').classList.add('oculto');
            // Pedir fullscreen DENTRO del handler del click (sino el navegador lo bloquea)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(function(){});
            }
        };

        document.addEventListener('fullscreenchange', function() {
            const icon = document.querySelector('#btnFs i');
            if (document.fullscreenElement) icon.className = 'bi bi-fullscreen-exit';
            else icon.className = 'bi bi-fullscreen';
        });

        // SSE para sincronizacion
        let evtSource = null;
        let usePolling = false;

        function conectarSSE() {
            try {
                evtSource = new EventSource(streamUrl);
                evtSource.onmessage = function(e) {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.slide) actualizarSlide(data.slide);
                    } catch (err) {}
                };
                evtSource.onerror = function() {
                    if (evtSource) evtSource.close();
                    if (!usePolling) {
                        usePolling = true;
                        iniciarPolling();
                    }
                };
            } catch (e) {
                usePolling = true;
                iniciarPolling();
            }
        }

        function iniciarPolling() {
            setInterval(function() {
                fetch(estadoUrl).then(r => r.json()).then(function(data) {
                    if (data.slide) actualizarSlide(data.slide);
                }).catch(function() {});
            }, 2000);
        }

        conectarSSE();

        // Auto-ocultar header/footer despues de 4s sin tocar
        let timeoutHide = null;
        function mostrarChrome() {
            document.getElementById('header').classList.remove('oculto');
            document.getElementById('footer').classList.remove('oculto');
            if (timeoutHide) clearTimeout(timeoutHide);
            timeoutHide = setTimeout(function() {
                document.getElementById('header').classList.add('oculto');
                document.getElementById('footer').classList.add('oculto');
            }, 4000);
        }
        document.body.addEventListener('click', function(e) {
            // No ocultar si se hace tap en el modal o en botones
            if (!e.target.closest('.modal-final')) mostrarChrome();
        });
        document.body.addEventListener('touchstart', function(e) {
            if (!e.target.closest('.modal-final')) mostrarChrome();
        });
        mostrarChrome();

        window.addEventListener('resize', function() {
            if (pdfDoc) renderSlide(slideActual);
        });
    </script>
</body>
</html>
